[build]
  command = "npm run build"
  publish = "dist"

# Netlify applies redirect rules IN ORDER, so anything below the /* catch-all is
# never reached.
#
# The old host first: Netlify does NOT redirect it to the primary domain on its
# own, it kept serving a full second copy of the site. A 301 is also what Search
# Console's Change of Address checks for. Deploy previews live on other
# *.netlify.app hosts and are untouched.
[[redirects]]
  from = "https://progetto-olanda-2punto0.netlify.app/*"
  to = "https://progettoolanda.it/:splat"
  status = 301
  force = true

# /privacy is a real static page (public/privacy.html), served
# without the SPA - it has to render with JavaScript off and the API asleep.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy/en"
  to = "/privacy.en.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms/en"
  to = "/terms.en.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
