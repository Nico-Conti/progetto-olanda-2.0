[build]
  command = "npm run build"
  publish = "dist"

# Netlify applies redirect rules IN ORDER, so anything below the /* catch-all is
# never reached. /privacy is a real static page (public/privacy.html), served
# without the SPA - it has to render with JavaScript off and the API asleep.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy/en"
  to = "/privacy.en.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms/en"
  to = "/terms.en.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
