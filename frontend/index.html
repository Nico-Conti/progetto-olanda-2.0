<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- Home-screen shortcut. Without these a phone draws a letter on grey: iOS reads
       apple-touch-icon (square, opaque - transparency turns black), Android reads
       the manifest's 192/512 icons. Squared from logo.png on the page background,
       the logo at 66% so Android's circular mask does not crop it. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Fonts are self-hosted (see src/fonts.css). Inter's latin file is on the
       critical path for every page, so it is preloaded; `crossorigin` is required
       on a font preload even same-origin, and without it the file is fetched
       twice. Everything else is left for the CSS to pull in. -->
  <link rel="preload" href="/fonts/inter-100-900-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Search Console ownership, for the Security Issues panel. URL-prefix
       property: netlify.app DNS is not ours, so DNS verification is not available.
       Removing this tag un-verifies the property. -->
  <meta name="google-site-verification" content="V4IpWJfMfeN4HOmXMT0r8_f6hEQkuufeD_Zlesh7iWM" />
  <title>Progetto Olanda 2.0</title>
  <meta name="description" content="Expected corners, goals, cards and fouls for every upcoming fixture, set against the bookmaker's line — and every prediction scored against what actually happened." />
  <meta name="theme-color" content="#09090b" />

  <!-- Social preview. og:image and og:url must be ABSOLUTE, so they carry the host:
       BOTH HAVE TO CHANGE if the host ever changes again, or every shared link
       keeps pointing its preview at the old one. poster.jpg is the
       trailer's own 1920x1080 still, which is the right shape for a preview card -
       so it is shared with LandingPage's trailer button, not a copy. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Progetto Olanda 2.0" />
  <meta property="og:title" content="Progetto Olanda 2.0" />
  <meta property="og:description" content="Expected corners, goals, cards and fouls for every upcoming fixture, set against the bookmaker's line — and every prediction scored against what actually happened." />
  <meta property="og:image" content="https://progettoolanda.it/trailer/poster.jpg" />
  <meta property="og:image:width" content="1920" />
  <meta property="og:image:height" content="1080" />
  <meta property="og:url" content="https://progettoolanda.it/" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <noscript>
    <p style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; text-align: center;
              font-family: system-ui, sans-serif; color: #a1a1aa; line-height: 1.6;">
      Progetto Olanda 2.0 needs JavaScript. It models expected corners, goals, cards and
      fouls for upcoming football fixtures and sets them against the bookmaker's line.
      Questions: <a href="mailto:info@progettoolanda.it" style="color: #34d399;">info@progettoolanda.it</a>
    </p>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
